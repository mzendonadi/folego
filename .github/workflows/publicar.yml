# Publica o Fôlego no servidor de produção (folego.online).
# Roda só quando alguém manda: aba Actions → "Publicar em produção" → Run workflow,
# ou no terminal: gh workflow run publicar.yml --repo mzendonadi/folego
# Antes de publicar, roda todos os testes; se algum falhar, nada vai para o servidor.
#
# Precisa (Settings → Secrets and variables → Actions):
#   segredo  VPS_SSH_KEY      chave privada SSH exclusiva do GitHub Actions (nunca a sua chave pessoal)
#   variável VPS_HOST         IP do servidor
#   variável VPS_PORT         porta SSH
#   variável VPS_USER         usuário SSH
#   variável VPS_KNOWN_HOSTS  linha pública de identificação do servidor (proteção contra servidor falso)
# As chaves de produção (Anthropic, Resend, banco...) continuam só no servidor, em ~/folego/deploy/.env.

name: Publicar em produção

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: 'O que está sendo publicado (fica registrado no histórico)'
        required: false
        type: string

# Nunca duas publicações ao mesmo tempo; a segunda espera a primeira terminar.
concurrency:
  group: producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Motor de cálculo (packages/domain)
        working-directory: packages/domain
        run: npm test

      - name: Instalar dependências da API
        working-directory: apps/api
        run: npm ci --no-audit --no-fund

      - name: API (tipos e testes)
        working-directory: apps/api
        run: |
          npx tsc --noEmit
          npm test

      - name: Instalar dependências do site
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Site (testes)
        working-directory: apps/web
        run: npm test

  publicar:
    name: Publicar
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir segredos e variáveis
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST }}
          PORT: ${{ vars.VPS_PORT }}
          USER_: ${{ vars.VPS_USER }}
          KNOWN: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          faltando=""
          [ -n "$SSH_KEY" ] || faltando="$faltando segredo:VPS_SSH_KEY"
          [ -n "$HOST" ]    || faltando="$faltando variável:VPS_HOST"
          [ -n "$PORT" ]    || faltando="$faltando variável:VPS_PORT"
          [ -n "$USER_" ]   || faltando="$faltando variável:VPS_USER"
          [ -n "$KNOWN" ]   || faltando="$faltando variável:VPS_KNOWN_HOSTS"
          if [ -n "$faltando" ]; then
            echo "::error::Falta configurar em Settings → Secrets and variables → Actions:$faltando"
            exit 1
          fi
          echo "Publicando: ${{ inputs.motivo || 'sem descrição' }} (commit ${GITHUB_SHA::7}, por ${GITHUB_ACTOR})"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Montar o site (build)
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -s dist/gestao/index.html

      - name: Empacotar
        run: |
          tar -czf "$RUNNER_TEMP/folego-deploy.tgz" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='node_modules' \
            --exclude='./apps/web/assets/vendor' \
            --exclude='./deploy/.env' \
            --exclude='./deploy/certs' \
            --exclude='./deploy/site' \
            .
          ls -lh "$RUNNER_TEMP/folego-deploy.tgz"

      - name: Preparar acesso SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Chaves de produção (Asaas e Turnstile): você cadastra como SEGREDO no GitHub (veja o roteiro) e o executor grava no
      # ~/folego/deploy/.env do servidor sem imprimir nada (o GitHub mascara segredos nos registros). Quem não cadastrou
      # um segredo não muda nada: o que já está no servidor continua. Com as três chaves do Asaas presentes, o pagamento
      # passa para o Asaas real e o gateway de mentira é desligado; só então os bloqueios do deploy.sh passam a valer.
      - name: Preparar chaves de produção (se cadastradas)
        env:
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_PIX_KEY: ${{ secrets.ASAAS_PIX_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          ASAAS_BASE_URL: ${{ secrets.ASAAS_BASE_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          META_TEST_EVENT_CODE: ${{ secrets.META_TEST_EVENT_CODE }}
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          OPENFINANCE_WEBHOOK_SECRET: ${{ secrets.OPENFINANCE_WEBHOOK_SECRET }}
          PLUGGY_CONNECT_URL: ${{ secrets.PLUGGY_CONNECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          BIRD_API_KEY: ${{ secrets.BIRD_API_KEY }}
          BIRD_WEBHOOK_SECRET: ${{ secrets.BIRD_WEBHOOK_SECRET }}
          BIRD_WHATSAPP_FROM: ${{ secrets.BIRD_WHATSAPP_FROM }}
          BIRD_TEMPLATE_INDICACAO: ${{ secrets.BIRD_TEMPLATE_INDICACAO }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          out="$RUNNER_TEMP/prod.env"; : > "$out"; chmod 600 "$out"
          # Meta Conversions API (decisão do dono em 2026-10-11): pixel certo e PageView anônimo ligado. Não são segredos.
          printf 'META_PIXEL_ID=1085904724208873\n' >> "$out"
          printf 'META_CAPI_PAGEVIEW=1\n' >> "$out"
          # IA (roteiros, planejador e chat FôlIA): só grava se o segredo existe; sem ele, o que já está no servidor continua.
          [ -n "$ANTHROPIC_API_KEY" ] && printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> "$out"
          [ -n "$ANTHROPIC_WORKSPACE_ID" ] && printf 'ANTHROPIC_WORKSPACE_ID=%s\n' "$ANTHROPIC_WORKSPACE_ID" >> "$out"
          [ -n "$TURNSTILE_SITE_KEY" ] && printf 'TURNSTILE_SITE_KEY=%s\n' "$TURNSTILE_SITE_KEY" >> "$out"
          [ -n "$TURNSTILE_SECRET" ]   && printf 'TURNSTILE_SECRET=%s\n' "$TURNSTILE_SECRET" >> "$out"
          [ -n "$META_CAPI_TOKEN" ]     && printf 'META_CAPI_TOKEN=%s\n' "$META_CAPI_TOKEN" >> "$out"
          [ -n "$META_TEST_EVENT_CODE" ] && printf 'META_TEST_EVENT_CODE=%s\n' "$META_TEST_EVENT_CODE" >> "$out"
          # WhatsApp do Fôlego pela Bird (convite de indicação do Prumo): só liga com a chave da API. O número é o da empresa (+55 11 91379-2370);
          # o segredo dos avisos (webhook) e o nome do modelo aprovado são opcionais. Ver deploy/BIRD-WHATSAPP.md.
          if [ -n "$BIRD_API_KEY" ]; then
            printf 'BIRD_API_KEY=%s\n' "$BIRD_API_KEY" >> "$out"
            printf 'BIRD_WHATSAPP_FROM=%s\n' "${BIRD_WHATSAPP_FROM:-+5511913792370}" >> "$out"
            [ -n "$BIRD_WEBHOOK_SECRET" ] && printf 'BIRD_WEBHOOK_SECRET=%s\n' "$BIRD_WEBHOOK_SECRET" >> "$out"
            [ -n "$BIRD_TEMPLATE_INDICACAO" ] && printf 'BIRD_TEMPLATE_INDICACAO=%s\n' "$BIRD_TEMPLATE_INDICACAO" >> "$out"
            echo "Bird: chave presente, o convite por WhatsApp será ligado."
          fi
          # Notificações no celular do Prumo instalado (web push): só liga com a chave privada VAPID; a pública o servidor calcula a partir dela.
          [ -n "$VAPID_PRIVATE_KEY" ] && printf 'VAPID_PRIVATE_KEY=%s\n' "$(printf '%s' "$VAPID_PRIVATE_KEY" | tr -d '[:space:]')" >> "$out"
          # Open Finance (Pluggy): só liga com as DUAS chaves; o segredo dos avisos e o endereço do widget são opcionais.
          if [ -n "$PLUGGY_CLIENT_ID" ] && [ -n "$PLUGGY_CLIENT_SECRET" ]; then
            printf 'PLUGGY_CLIENT_ID=%s\n' "$PLUGGY_CLIENT_ID" >> "$out"
            printf 'PLUGGY_CLIENT_SECRET=%s\n' "$PLUGGY_CLIENT_SECRET" >> "$out"
            [ -n "$OPENFINANCE_WEBHOOK_SECRET" ] && printf 'OPENFINANCE_WEBHOOK_SECRET=%s\n' "$OPENFINANCE_WEBHOOK_SECRET" >> "$out"
            [ -n "$PLUGGY_CONNECT_URL" ] && printf 'PLUGGY_CONNECT_URL=%s\n' "$PLUGGY_CONNECT_URL" >> "$out"
            echo "Open Finance: chaves presentes, as contas conectadas serão ligadas."
          fi
          if [ -n "$ASAAS_API_KEY" ] && [ -n "$ASAAS_PIX_KEY" ] && [ -n "$ASAAS_WEBHOOK_TOKEN" ]; then
            # A chave do Asaas começa com "$": aspas simples evitam que o Docker a corrompa.
            printf "ASAAS_API_KEY='%s'\n" "$ASAAS_API_KEY" >> "$out"
            printf 'ASAAS_PIX_KEY=%s\n' "$ASAAS_PIX_KEY" >> "$out"
            printf 'ASAAS_WEBHOOK_TOKEN=%s\n' "$ASAAS_WEBHOOK_TOKEN" >> "$out"
            printf 'ASAAS_BASE_URL=%s\n' "${ASAAS_BASE_URL:-https://api.asaas.com/v3}" >> "$out"
            printf 'PAYMENT_PROVIDER=asaas\nREQUIRE_PRODUCTION_KEYS=1\n' >> "$out"
            echo "Asaas: chaves presentes, o pagamento passa para o Asaas."
          else
            echo "Asaas: segredos não cadastrados, o pagamento continua como está no servidor."
          fi
          echo "Linhas preparadas: $(wc -l < "$out")"

      - name: Enviar e publicar no servidor
        env:
          HOST: ${{ vars.VPS_HOST }}
          PORT: ${{ vars.VPS_PORT }}
          USER_: ${{ vars.VPS_USER }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20"
          scp $SSH_OPTS -P "$PORT" "$RUNNER_TEMP/folego-deploy.tgz" "$USER_@$HOST:folego-deploy.tgz"
          if [ -s "$RUNNER_TEMP/prod.env" ]; then scp $SSH_OPTS -P "$PORT" "$RUNNER_TEMP/prod.env" "$USER_@$HOST:.folego-prod.env"; fi
          # Extrai por cima de ~/folego sem apagar o que só existe no servidor (.env, certificados).
          ssh $SSH_OPTS -p "$PORT" "$USER_@$HOST" '
            set -e
            rm -rf ~/folego-new && mkdir -p ~/folego-new
            tar -C ~/folego-new -xzf ~/folego-deploy.tgz
            cp -a ~/folego-new/. ~/folego/
            rm -rf ~/folego-new ~/folego-deploy.tgz
            cd ~/folego
            if [ -s ~/.folego-prod.env ] && [ -f deploy/.env ]; then
              bash deploy/ops/mesclar-env.sh ~/.folego-prod.env deploy/.env
            fi
            rm -f ~/.folego-prod.env
            bash deploy/deploy.sh
          '

      - name: Conferir o site no ar
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://folego.online/api/health || true)
            if [ "$code" = "200" ]; then echo "Site no ar (api/health = 200)"; exit 0; fi
            sleep 10
          done
          echo "::error::O site não respondeu 200 depois da publicação (último código: $code)"
          exit 1

      - name: Apagar a chave do executor
        if: always()
        run: rm -f ~/.ssh/deploy_key "$RUNNER_TEMP/folego-deploy.tgz" "$RUNNER_TEMP/prod.env"
