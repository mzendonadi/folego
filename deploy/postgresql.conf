# Ajustado para o servidor real: 4 vCPU, 7,8 GiB de RAM, SSD (medido em 2026-09-26; DOCUMENTO-OFICIAL.md §8.1).
# shared_buffers (1 GB) cabe nas 1.100 páginas grandes (2,2 GB) já reservadas no host.
listen_addresses = '*'          # acessível só na rede interna do Docker (sem "ports" no compose)
max_connections = 50
shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 256MB
huge_pages = try                # aproveita as páginas grandes reservadas no host
wal_compression = on
max_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
random_page_cost = 1.1          # SSD
effective_io_concurrency = 200
autovacuum_max_workers = 3
log_min_duration_statement = 300ms
timezone = 'UTC'
