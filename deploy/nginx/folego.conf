# Nginx DENTRO do container (imagem oficial). Montado como /etc/nginx/conf.d/default.conf. NÃO testado ainda em servidor real.
# Cloudflare na frente (proxy ligado, modo SSL/TLS "Full"). O certificado de origem pode ser autoassinado no modo "Full";
# para "Full (strict)" troque por um certificado Origin CA do Cloudflare (deploy/certs/origin.pem e origin.key).

# Gerado por deploy.sh: set_real_ip_from (faixas do Cloudflare), real_ip_header e o mapa $from_cloudflare.
include /etc/nginx/cloudflare-ips.conf;

limit_req_zone $binary_remote_addr zone=folego_api:10m rate=20r/s;

# Qualquer host desconhecido (inclusive nomes antigos que ainda apontem para este IP) é recusado sem resposta.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  return 444;
}
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  ssl_certificate     /etc/ssl/folego/origin.pem;
  ssl_certificate_key /etc/ssl/folego/origin.key;
  return 444;
}

# HTTP → HTTPS e www → domínio principal
server {
  listen 80;
  listen [::]:80;
  server_name folego.online www.folego.online;
  if ($from_cloudflare = 0) { return 444; }
  return 301 https://folego.online$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.folego.online;
  ssl_certificate     /etc/ssl/folego/origin.pem;
  ssl_certificate_key /etc/ssl/folego/origin.key;
  if ($from_cloudflare = 0) { return 444; }
  return 301 https://folego.online$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name folego.online;

  ssl_certificate     /etc/ssl/folego/origin.pem;
  ssl_certificate_key /etc/ssl/folego/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Só aceita quem vem do Cloudflare (ou do próprio servidor, para testes). Acesso direto ao IP é derrubado.
  if ($from_cloudflare = 0) { return 444; }

  root /var/www/folego;
  index index.html;
  server_tokens off;

  # A política (CSP) TEM que ser idêntica à de apps/api/src/security.ts. Sem add_header dentro de location
  # (cada location que usa add_header descarta os cabeçalhos do servidor).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  # PRÉ-LANÇAMENTO: enquanto o pagamento real não estiver ligado, nada de indexação. REMOVER esta linha e o robots.txt no lançamento.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # Upload do eBook de presente (backoffice): PDF de até 15 MB. Só esta rota aceita corpo grande.
  location ~ ^/api/gestao/ebooks {
    limit_req zone=folego_api burst=10 nodelay;
    client_max_body_size 16m;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location /api/ {
    limit_req zone=folego_api burst=40 nodelay;
    client_max_body_size 64k;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # IP do visitante já validado pelo módulo realip (só confia em faixas do Cloudflare); nunca repassa o cabeçalho do cliente.
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  location /webhooks/ {
    client_max_body_size 64k;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ~* \.woff2$ {
    expires 1y;
  }
  # Pacote da aplicação com HASH no nome: cada versão tem URL nova, então pode ficar em cache por 1 ano.
  location /assets/app/ {
    expires 1y;
    try_files $uri =404;
  }

  # Sem cache no restante (styles.css tem ?v=hash, config.js muda por ambiente): o Cloudflare guardava versões antigas por horas depois de uma publicação.
  # ("expires -1" envia Cache-Control: no-cache sem descartar os cabeçalhos de segurança do servidor.)
  # Quando houver arquivos com hash no nome, dá para voltar a usar cache longo.
  location /assets/ {
    expires -1;
    try_files $uri =404;
  }

  location ~ /\. { deny all; }

  # Backoffice (folego.online/gestao, também aceita /gestão com acento). Página própria, sem cache, noindex pela própria página.
  location = /gestao { return 301 /gestao/; }
  location = "/gestão" { return 301 /gestao/; }
  location ^~ "/gestão/" { return 301 /gestao/; }
  location ^~ /gestao/ {
    expires -1;
    try_files $uri $uri/ /gestao/index.html;
  }

  # index.html precisa de "no-cache" também: sem o cabeçalho, o navegador guarda o HTML por heurística (Last-Modified)
  # e continua apontando para o bundle antigo depois de uma publicação (visto em 2026-09-27, D-060).
  location / {
    expires -1;
    try_files $uri $uri/ =404;
  }
}
