<!doctype html>
<meta charset="utf-8">
<title>Gerador da marca Fôlego</title>
<body style="font:16px system-ui;padding:24px"><p id="log">gerando…</p>
<script>
const C = { mentaEscura: '#4FB78F', verde: '#0E5B49', fundo: '#0A3D31', menta: '#8FE0BE', mentaClara: '#D9EFE5', papel: '#F6F3EC', tinta: '#13231D', tinta2: '#3F514A', ambar: '#A55F00', ambarClaro: '#F2B24A', branco: '#FFFFFF' };
const rad = (d) => (d * Math.PI) / 180;

/** Marca do Fôlego: anel aberto (a respiração) + ponto de ar saindo pela abertura + centro. Desenhada em uma grade de 32. */
function folegoMark(ctx, x, y, size, { ring = C.verde, dot = C.menta, puff = C.ambar } = {}) {
  const s = size / 32;
  ctx.save();
  ctx.translate(x - size / 2, y - size / 2);
  ctx.lineCap = 'round';
  ctx.strokeStyle = ring;
  ctx.lineWidth = 2.8 * s;
  ctx.beginPath();
  ctx.arc(16 * s, 16 * s, 11.5 * s, rad(-62), rad(217), false);
  ctx.stroke();
  ctx.fillStyle = puff;
  const a = rad(257.5);
  ctx.beginPath();
  ctx.arc((16 + 11.5 * Math.cos(a)) * s, (16 + 11.5 * Math.sin(a)) * s, 1.9 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = dot;
  ctx.beginPath();
  ctx.arc(16 * s, 16 * s, 4.6 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/** Marca do Prumo v3: fio, argola, colar duplo e corpo torneado com facetas, brilho e sulcos. Mesma geometria dos SVG. */
function prumoMark(ctx, x, y, size, { left = C.verde, right = C.fundo, groove = C.menta, shine = C.menta, hook = C.ambar, string = C.verde } = {}) {
  const s = size / 32;
  ctx.save();
  ctx.translate(x - size / 2, y - size / 2);
  ctx.scale(s, s);
  ctx.lineCap = 'round';
  const stroke = (d, color, w, alpha = 1) => { ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke(new Path2D(d)); ctx.restore(); };
  stroke("M16 1V6.6", string, 1.2);
  ctx.strokeStyle = hook; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.arc(16, 8.1, 1.5, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = hook;
  ctx.beginPath(); ctx.roundRect(12.6, 10.1, 6.8, 1.7, 0.85); ctx.fill();
  ctx.save(); ctx.globalAlpha = 0.78; ctx.beginPath(); ctx.roundRect(11.7, 12.1, 8.6, 1.4, 0.7); ctx.fill(); ctx.restore();
  ctx.fillStyle = left; ctx.fill(new Path2D("M16 14.5H12.3C11.1 14.5 10.4 15.3 10.4 16.5C10.4 21.6 12.6 26.9 16 31.4Z"));
  ctx.fillStyle = right; ctx.fill(new Path2D("M16 14.5H19.7C20.9 14.5 21.6 15.3 21.6 16.5C21.6 21.6 19.4 26.9 16 31.4Z"));
  stroke("M12.5 16.2C12.4 20.2 13.6 24.2 15.1 27.4", shine, 0.9, 0.75);
  stroke("M10.7 18.1H21.3", groove, 0.9);
  stroke("M10.9 19.8H21.1", groove, 0.6, 0.8);
  ctx.restore();
}

const font = (w, px, fam = 'Fraunces') => `${w} ${px}px ${fam}, Georgia, serif`;
function text(ctx, str, x, y, { size = 40, weight = 560, fam = 'Fraunces', color = C.tinta, align = 'left', maxWidth } = {}) {
  ctx.font = font(weight, size, fam);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  maxWidth ? ctx.fillText(str, x, y, maxWidth) : ctx.fillText(str, x, y);
}
function wrap(ctx, str, x, y, maxW, lineH, o) {
  ctx.font = font(o.weight ?? 400, o.size, o.fam ?? 'Figtree');
  const words = str.split(' ');
  let line = '';
  for (const w of words) {
    const test = line ? `${line} ${w}` : w;
    if (ctx.measureText(test).width > maxW && line) {
      text(ctx, line, x, y, o);
      line = w;
      y += lineH;
    } else line = test;
  }
  if (line) text(ctx, line, x, y, o);
  return y;
}
function lockup(ctx, x, y, h, { mark = folegoMark, markOpts, word = 'fôlego', color = C.verde } = {}) {
  mark(ctx, x + h / 2, y, h, markOpts);
  text(ctx, word, x + h * 1.18, y + h * 0.28, { size: h * 0.92, weight: 560, color });
}
const canvas = (w, h, bg) => {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); }
  return [c, ctx];
};
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rings(ctx, w, h, color, alpha = 0.1) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = 2;
  for (const r of [120, 220, 330, 450, 580]) { ctx.beginPath(); ctx.arc(w * 0.86, h * 0.1, r * (h / 630), 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();
}

const jobs = {};
// ---- ícones do app (fundo verde, marca clara) ----
const icon = (size, { safe = 0.58, radius = 0.22 } = {}) => () => {
  const [c, ctx] = canvas(size, size);
  roundRect(ctx, 0, 0, size, size, size * radius);
  ctx.fillStyle = C.verde; ctx.fill();
  folegoMark(ctx, size / 2, size / 2, size * safe, { ring: C.papel, dot: C.menta, puff: C.ambarClaro });
  return c;
};
jobs['favicon-32.png'] = icon(32, { safe: 0.78, radius: 0.25 });
jobs['favicon-48.png'] = icon(48, { safe: 0.78, radius: 0.25 });
jobs['apple-touch-icon.png'] = () => { const [c, ctx] = canvas(180, 180, C.verde); folegoMark(ctx, 90, 90, 112, { ring: C.papel, dot: C.menta, puff: C.ambarClaro }); return c; };
jobs['icon-192.png'] = icon(192);
jobs['icon-512.png'] = icon(512);
jobs['icon-maskable-512.png'] = () => { const [c, ctx] = canvas(512, 512, C.verde); folegoMark(ctx, 256, 256, 260, { ring: C.papel, dot: C.menta, puff: C.ambarClaro }); return c; };

// ---- avatares ----
jobs['avatar-folego-1024.png'] = () => { const [c, ctx] = canvas(1024, 1024, C.verde); folegoMark(ctx, 512, 512, 560, { ring: C.papel, dot: C.menta, puff: C.ambarClaro }); return c; };
jobs['avatar-prumo-1024.png'] = () => { const [c, ctx] = canvas(1024, 1024, C.fundo); prumoMark(ctx, 512, 512, 640, { left: C.menta, right: C.mentaEscura, groove: C.fundo, shine: C.mentaClara, hook: C.ambarClaro, string: C.papel }); return c; };

// ---- imagem de compartilhamento do site ----
jobs['og-image.png'] = () => {
  const [c, ctx] = canvas(1200, 630, C.papel);
  rings(ctx, 1200, 630, C.verde, 0.12);
  ctx.fillStyle = C.verde; ctx.fillRect(0, 0, 18, 630);
  lockup(ctx, 78, 130, 96);
  text(ctx, 'Organize suas dívidas', 78, 330, { size: 62, weight: 560, color: C.tinta });
  text(ctx, 'e só pague se gostar.', 78, 404, { size: 62, weight: 560, color: C.verde });
  text(ctx, 'Diagnóstico na hora, sem cadastro. Pix só se você gostar.', 78, 478, { size: 30, weight: 500, fam: 'Figtree', color: C.tinta2 });
  text(ctx, 'folego.online', 78, 560, { size: 30, weight: 700, fam: 'Figtree', color: C.tinta });
  return c;
};

// ---- capas de redes ----
const banner = (w, h, withPrumo = false) => () => {
  const [c, ctx] = canvas(w, h, C.verde);
  ctx.save(); ctx.globalAlpha = 0.14; ctx.strokeStyle = C.papel; ctx.lineWidth = 2;
  for (const r of [0.5, 0.8, 1.1, 1.45]) { ctx.beginPath(); ctx.arc(w * 0.9, h * 0.15, h * r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();
  const m = h * 0.34;
  folegoMark(ctx, w * 0.07 + m / 2, h / 2, m, { ring: C.papel, dot: C.menta, puff: C.ambarClaro });
  text(ctx, 'fôlego', w * 0.07 + m * 1.2, h / 2 + m * 0.14, { size: m * 0.95, weight: 560, color: C.papel });
  text(ctx, 'Respira. A gente organiza suas dívidas com você.', w * 0.07 + m * 1.2, h / 2 + m * 0.62, { size: Math.round(h * 0.075), weight: 500, fam: 'Figtree', color: C.mentaClara });
  return c;
};
jobs['capa-x-1500x500.png'] = banner(1500, 500);
jobs['capa-linkedin-1584x396.png'] = banner(1584, 396);
jobs['capa-facebook-1640x624.png'] = banner(1640, 624);
// Capa de PÁGINA do Facebook: a foto de perfil fica centralizada e cobre a parte de baixo, e no celular as laterais são cortadas.
// Por isso o conteúdo vai centralizado, só na metade de cima (acima de y = 340 de 624).
jobs['capa-facebook-pagina-1640x624.png'] = () => {
  const w = 1640, h = 624;
  const [c, ctx] = canvas(w, h, C.verde);
  ctx.save(); ctx.globalAlpha = 0.14; ctx.strokeStyle = C.papel; ctx.lineWidth = 2;
  for (const r of [0.5, 0.8, 1.1, 1.45]) { ctx.beginPath(); ctx.arc(w * 0.9, h * 0.15, h * r, 0, Math.PI * 2); ctx.stroke(); }
  for (const r of [0.4, 0.7]) { ctx.beginPath(); ctx.arc(w * 0.08, h * 0.95, h * r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();
  const m = 150, cy = 150, gap = 34, wordSize = 136, wordW = wordSize * 2.93;
  const x0 = (w - (m + gap + wordW)) / 2;
  folegoMark(ctx, x0 + m / 2, cy, m, { ring: C.papel, dot: C.menta, puff: C.ambarClaro });
  text(ctx, 'fôlego', x0 + m + gap, cy + m * 0.14, { size: wordSize, weight: 560, color: C.papel });
  text(ctx, 'Respira. A gente organiza suas dívidas com você.', w / 2, 292, { size: 38, weight: 500, fam: 'Figtree', color: C.mentaClara, align: 'center' });
  return c;
};

// ---- primeiro post: apresentação do Fôlego ----
jobs['post-apresentacao-1080.png'] = () => {
  const [c, ctx] = canvas(1080, 1080, C.verde);
  ctx.save(); ctx.globalAlpha = 0.14; ctx.strokeStyle = C.papel; ctx.lineWidth = 2;
  for (const r of [160, 300, 460, 640]) { ctx.beginPath(); ctx.arc(1000, 90, r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();
  text(ctx, 'Respira.', 90, 400, { size: 230, weight: 600, color: C.papel });
  wrap(ctx, 'A gente organiza suas dívidas com você.', 90, 520, 860, 66, { size: 54, weight: 500, fam: 'Fraunces', color: C.mentaClara });
  const itens = ['Diagnóstico grátis, em 3 minutos', 'Sem cadastro e sem CPF', 'Só paga se gostar'];
  itens.forEach((t, i) => {
    const y = 735 + i * 76;
    ctx.fillStyle = C.ambarClaro; ctx.beginPath(); ctx.arc(104, y - 13, 9, 0, Math.PI * 2); ctx.fill();
    text(ctx, t, 140, y, { size: 42, weight: 600, fam: 'Figtree', color: C.papel });
  });
  lockup(ctx, 90, 985, 64, { markOpts: { ring: C.papel, dot: C.menta, puff: C.ambarClaro }, color: C.papel });
  text(ctx, 'folego.online', 990, 990, { size: 30, weight: 700, fam: 'Figtree', color: C.mentaClara, align: 'right' });
  return c;
};

// ---- modelos de publicação ----
jobs['post-dica-1080.png'] = () => {
  const [c, ctx] = canvas(1080, 1080, C.papel);
  rings(ctx, 1080, 1080, C.verde, 0.1);
  text(ctx, 'DICA DO FÔLEGO', 90, 150, { size: 30, weight: 800, fam: 'Figtree', color: C.ambar });
  const y = wrap(ctx, 'Dívida com juro de cartão cresce mais rápido do que qualquer parcela que você paga. Comece por ela.', 90, 300, 880, 92, { size: 78, weight: 560, fam: 'Fraunces', color: C.tinta });
  text(ctx, 'Veja a ordem certa no diagnóstico grátis', 90, y + 130, { size: 36, weight: 600, fam: 'Figtree', color: C.verde });
  lockup(ctx, 90, 965, 64);
  text(ctx, 'folego.online', 990, 990, { size: 30, weight: 700, fam: 'Figtree', color: C.tinta2, align: 'right' });
  return c;
};
jobs['post-numero-1080.png'] = () => {
  const [c, ctx] = canvas(1080, 1080, C.verde);
  ctx.save(); ctx.globalAlpha = 0.14; ctx.strokeStyle = C.papel; ctx.lineWidth = 2;
  for (const r of [160, 300, 460, 640]) { ctx.beginPath(); ctx.arc(1000, 90, r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();
  text(ctx, 'VOCÊ SABIA?', 90, 150, { size: 30, weight: 800, fam: 'Figtree', color: C.ambarClaro });
  text(ctx, '8% ao mês', 90, 470, { size: 190, weight: 600, color: C.papel });
  wrap(ctx, 'é o teto de juros do cheque especial. Se está no negativo, o Prumo mostra quanto isso custa por mês.', 90, 590, 880, 60, { size: 46, weight: 500, fam: 'Figtree', color: C.mentaClara });
  lockup(ctx, 90, 965, 64, { markOpts: { ring: C.papel, dot: C.menta, puff: C.ambarClaro }, color: C.papel });
  return c;
};
jobs['story-1080x1920.png'] = () => {
  const [c, ctx] = canvas(1080, 1920, C.papel);
  rings(ctx, 1080, 1920, C.verde, 0.1);
  folegoMark(ctx, 540, 640, 300);
  text(ctx, 'fôlego', 540, 900, { size: 170, weight: 560, color: C.verde, align: 'center' });
  wrap(ctx, 'Respira. A gente organiza suas dívidas com você.', 130, 1090, 820, 78, { size: 62, weight: 500, fam: 'Fraunces', color: C.tinta });
  text(ctx, 'Diagnóstico grátis, sem cadastro', 540, 1500, { size: 44, weight: 700, fam: 'Figtree', color: C.verde, align: 'center' });
  text(ctx, 'folego.online', 540, 1580, { size: 44, weight: 500, fam: 'Figtree', color: C.tinta2, align: 'center' });
  return c;
};

(async () => {
  const log = document.getElementById('log');
  await new FontFace('Fraunces', 'url(/fraunces-latin-wght-normal.woff2)', { weight: '100 900' }).load().then((f) => document.fonts.add(f));
  await new FontFace('Figtree', 'url(/figtree-latin-wght-normal.woff2)', { weight: '100 900' }).load().then((f) => document.fonts.add(f));
  await document.fonts.ready;
  let n = 0;
  for (const [name, make] of Object.entries(jobs)) {
    const c = make();
    await fetch('/salvar/' + encodeURIComponent(name), { method: 'POST', body: c.toDataURL('image/png') });
    n += 1;
    log.textContent = `gerado ${n}/${Object.keys(jobs).length}: ${name}`;
  }
  log.textContent = `feito: ${n} imagens`;
})();
</script>
