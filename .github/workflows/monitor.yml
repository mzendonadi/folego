# Vigia o Fôlego de fora do servidor a cada 10 minutos. Se algo estiver errado, esta execução FALHA e o GitHub
# manda e-mail ao dono do repositório ("Run failed"). Também dá para rodar na mão (Run workflow).
# Confere: site no ar, API saudável, e a saúde profunda (/api/health/deep: banco, worker, fila de entregas,
# webhooks de pagamento, e-book, backup recente e disco).

name: Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir o site e a saúde
        env:
          # Opcional: segredo MONITOR_KEY (Settings > Secrets > Actions). Se existir, vai no cabeçalho X-Monitor-Key,
          # para uma regra do Cloudflare (WAF > Skip) liberar o monitor sem abrir o site para robôs em geral.
          MONITOR_KEY: ${{ secrets.MONITOR_KEY }}
        run: |
          falhas=""
          avisos=""
          UA="FolegoMonitor/1.0 (+https://github.com/mzendonadi/folego; GitHub Actions)"
          args=(-sS -A "$UA" --max-time 20)
          # tira espaços e quebras de linha que costumam vir junto ao colar o segredo
          MONITOR_KEY=$(printf '%s' "$MONITOR_KEY" | tr -d '[:space:]')
          if [ -n "$MONITOR_KEY" ]; then args+=(-H "X-Monitor-Key: $MONITOR_KEY"); fi

          # Pede a URL até 3 vezes (um engasgo isolado não deve acordar ninguém).
          # Escreve em $RUNNER_TEMP/<nome>.code e .hdr; devolve o código HTTP em $code.
          pedir() {
            nome="$1"; url="$2"; code=000
            for i in 1 2 3; do
              rc=0
              code=$(curl "${args[@]}" -D "$RUNNER_TEMP/$nome.hdr" -o "$RUNNER_TEMP/$nome.json" -w '%{http_code}' "$url" 2>"$RUNNER_TEMP/$nome.err") || rc=$?
              code=${code:-000}
              echo "[$nome] tentativa $i: HTTP $code (curl rc=$rc) $(tr '\n' ' ' < "$RUNNER_TEMP/$nome.err")"
              [ "$code" = "200" ] && return 0
              [ "$i" = "3" ] || sleep $((i * 15))
            done
            return 1
          }

          # 403 com cabeçalho cf-mitigated = o Cloudflare respondeu e barrou o monitor (não é o site fora do ar).
          bloqueado_cf() { [ "$code" = "403" ] && grep -qi '^cf-mitigated' "$RUNNER_TEMP/$1.hdr" 2>/dev/null; }

          pedir home https://folego.online/ || {
            if bloqueado_cf home; then avisos="$avisos\n- Página inicial: Cloudflare barrou o monitor (403 cf-mitigated)"
            else falhas="$falhas\n- Página inicial respondeu $code"; fi
          }

          pedir deep https://folego.online/api/health/deep || {
            if bloqueado_cf deep; then
              avisos="$avisos\n- Saúde profunda: Cloudflare barrou o monitor (403 cf-mitigated)"
            else
              falhas="$falhas\n- Saúde profunda respondeu $code"
              if [ -s "$RUNNER_TEMP/deep.json" ]; then
                detalhe=$(node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));for(const [k,v] of Object.entries(j.checks||{}))if(!v.ok)console.log('  * '+k+': '+v.detail)" "$RUNNER_TEMP/deep.json" 2>/dev/null || true)
                falhas="$falhas\n$detalhe"
              fi
            fi
          }

          if [ -n "$avisos" ]; then
            echo "::warning::Monitor barrado pelo Cloudflare - a saúde não foi conferida nesta rodada. Crie a regra WAF (Skip) para o cabeçalho X-Monitor-Key e salve o segredo MONITOR_KEY."
            printf "$avisos\n"
          fi
          if [ -n "$falhas" ]; then
            echo "::error::Fôlego com problema:"
            printf "$falhas\n"
            exit 1
          fi
          echo "Tudo certo."
